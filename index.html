<script>
  /* Decide before first paint whether the logo intro plays, so the hero never
     flashes. Without JavaScript, or with reduced motion, the page keeps the
     static logo and visible tagline. */
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !window.fetch || !window.Promise) {
      return;
    }
    root.classList.add('intro');

    /* Start both downloads now, in parallel, instead of after the page parses. */
    var intro = window.menularIntro = { started: false };
    intro.data = fetch('/assets/animation/menular-logo-intro.json').then(function (r) {
      if (!r.ok) {
        throw new Error('Animation HTTP ' + r.status);
      }
      return r.json();
    });
    intro.lib = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = '/assets/js/lottie_light.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    intro.data.catch(function () {});
    intro.lib.catch(function () {});

    /* If the animation is not playing within 4 seconds, show the static logo. */
    setTimeout(function () {
      if (!intro.started) {
        root.classList.remove('intro');
      }
    }, 4000);
  })();
</script>
<script src="/assets/js/home.js" defer></script>
<link rel="stylesheet" href="/assets/css/footer.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: #f7f1e7;
    color: #2b2520;
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* HERO: cream, like the app's onboarding welcome screen */
  .hero {
    padding: 64px 24px 40px;
    text-align: center;
  }

  /* Space for the logo is reserved at the animation's own aspect ratio
     (1913 x 623), so nothing moves when it loads or falls back. */
  .hero-logo {
    position: relative;
    width: 340px;
    max-width: 100%;
    aspect-ratio: 1913 / 623;
    margin: 0 auto;
  }

  .hero-logo-static {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: auto;
    transform: translateY(-50%);
    border-radius: 8px;
  }

  .hero-logo-anim {
    position: absolute;
    inset: 0;
  }

  .hero-tagline {
    max-width: 11em;
    margin: 14px auto 0;
    font-size: 30px;
    font-weight: 300;
    line-height: 1.25;
    letter-spacing: -0.2px;
    color: #5a4f47;
    text-wrap: balance;
  }

  .hero-sub {
    max-width: 460px;
    margin: 22px auto 0;
    font-size: 18px;
    line-height: 1.6;
    color: #5a4f47;
  }

  /* App Store badge: Apple artwork shown as supplied, at least 40px tall,
     with clear space of one quarter of its height on every side. */
  .store-badge {
    display: inline-block;
    margin-top: 18px;
    padding: 12px;
  }

  .store-badge img {
    display: block;
    height: 48px;
    width: auto;
  }

  .hero-coming {
    font-size: 17px;
    font-weight: 600;
    color: #2b2520;
  }

  .hero-android {
    margin-top: 6px;
    font-size: 14px;
    line-height: 1.5;
    color: rgba(43,37,32,0.68);
  }

  /* Intro state, set by the head script only when the animation will play. */
  .intro .hero-logo-static {
    visibility: hidden;
  }

  .intro .hero-tagline {
    opacity: 0;
    transform: translateY(22px);
    /* Fitted to React Native's default Animated.timing easing used in the app. */
    transition:
      opacity 900ms cubic-bezier(0.39, 0.06, 0.61, 0.94),
      transform 900ms cubic-bezier(0.39, 0.06, 0.61, 0.94);
  }

  .intro .hero.is-revealed .hero-tagline {
    opacity: 1;
    transform: none;
  }

  /* SCREENSHOT GALLERY: native horizontal scroll with snap points */
  .gallery {
    position: relative;
    padding-top: 8px;
  }

  .gallery-track {
    --gap: 16px;
    --pad: 24px;
    display: flex;
    gap: var(--gap);
    list-style: none;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scroll-padding-inline: var(--pad);
    padding: 8px var(--pad) 32px;
    scrollbar-width: thin;
    scrollbar-color: rgba(43,37,32,0.2) transparent;
  }

  .gallery-track:focus-visible {
    outline: 2px solid #c2603f;
    outline-offset: -2px;
    border-radius: 12px;
  }

  /* Phones: one screenshot, with the next one peeking in. */
  .gallery-item {
    flex: 0 0 72%;
    scroll-snap-align: start;
  }

  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 2px 6px rgba(43,37,32,0.08), 0 12px 28px rgba(43,37,32,0.14);
    background: #efe6d9;
  }

  .gallery-controls {
    display: none;
  }

  /* Tablets: about two. */
  @media (min-width: 600px) {
    .gallery-track { --gap: 20px; --pad: 32px; }
    .gallery-item { flex-basis: calc((100% - var(--gap)) / 2.2); }
  }

  /* Wide screens: four, with arrow buttons in the side gutters. */
  @media (min-width: 1024px) {
    .gallery-track { --pad: 64px; }
    .gallery-item { flex-basis: calc((100% - 3 * var(--gap)) / 4); }

    .js .gallery-track { scrollbar-width: none; }
    .js .gallery-track::-webkit-scrollbar { display: none; }

    .js .gallery-controls { display: block; }
  }

  .gallery-btn {
    position: absolute;
    top: calc(50% - 8px);
    width: 44px;
    height: 44px;
    margin-top: -22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #c2603f;
    box-shadow: 0 2px 10px rgba(43,37,32,0.16);
    cursor: pointer;
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .gallery-prev { left: 10px; }
  .gallery-next { right: 10px; }

  .gallery-btn:hover:not(:disabled) { transform: scale(1.06); }

  .gallery-btn:focus-visible {
    outline: 2px solid #c2603f;
    outline-offset: 3px;
  }

  .gallery-btn:disabled {
    opacity: 0.35;
    cursor: default;
    box-shadow: none;
  }

  /* LEARN MORE */
  .learn-more {
    padding: 8px 24px 24px;
    text-align: center;
  }

  .learn-more a {
    font-size: 18px;
    font-weight: 600;
    color: #c2603f;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
    border-radius: 3px;
  }

  .learn-more a:hover {
    text-decoration-thickness: 2.5px;
  }

  .learn-more a:focus-visible {
    outline: 2px solid #c2603f;
    outline-offset: 4px;
  }

  @media (max-width: 480px) {
    .hero { padding: 48px 20px 32px; }
    .hero-logo { width: 260px; }
    .hero-tagline { font-size: 26px; }
    .hero-sub { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gallery-btn { transition: none; }
  }
</style>
</head>
