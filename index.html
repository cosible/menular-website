<script>
  /* Decide before first paint whether the logo intro plays, so the hero never
     flashes. Without JavaScript, or with reduced motion, the page keeps the
     static logo and visible tagline. */
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !window.fetch || !window.Promise) {
      return;
    }
    root.classList.add('intro');

    /* Start both downloads now, in parallel, instead of after the page parses. */
    var intro = window.menularIntro = { started: false };
    intro.data = fetch('/assets/animation/menular-logo-intro.json').then(function (r) {
      if (!r.ok) {
        throw new Error('Animation HTTP ' + r.status);
      }
      return r.json();
    });
    intro.lib = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = '/assets/js/lottie_light.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    intro.data.catch(function () {});
    intro.lib.catch(function () {});

    /* If the animation is not playing within 4 seconds, show the static logo. */
    setTimeout(function () {
      if (!intro.started) {
        root.classList.remove('intro');
      }
    }, 4000);
  })();
</script>
<script src="/assets/js/home.js" defer></script>
<link rel="preload" href="/assets/fonts/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/footer.css">
<style>
  :root {
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: #f7f1e7;
    color: #2b2520;
    -webkit-font-smoothing: antialiased;
  }

  /* OPENING: cream, like the app's onboarding welcome screen. Leaves room
     for a strip of the blush section to peek in at the bottom. */
  .hero {
    min-height: max(520px, calc(100vh - 72px));
    min-height: max(520px, calc(100svh - 72px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px;
    text-align: center;
  }

  /* Space for the logo is reserved at the animation's own aspect ratio
     (1913 x 623), so nothing moves when it loads or falls back. */
  .hero-logo {
    position: relative;
    width: clamp(220px, 46vw, 480px);
    max-width: 100%;
    aspect-ratio: 1913 / 623;
  }

  .hero-logo-static {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: auto;
    transform: translateY(-50%);
    border-radius: 8px;
  }

  .hero-logo-anim {
    position: absolute;
    inset: 0;
  }

  .hero-tagline {
    margin-top: clamp(22px, 3vw, 34px);
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: clamp(24px, 3vw, 36px);
    line-height: 1.25;
    color: #2b2520;
    text-wrap: balance;
  }

  .see-how {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 48px;
    margin-top: clamp(28px, 4vw, 44px);
    padding: 0 22px;
    border: 1.5px solid rgba(194,96,63,.5);
    border-radius: 999px;
    background: transparent;
    color: #6D2E19;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .2s ease;
  }

  .see-how:hover {
    background: #F1DED5;
  }

  .see-how:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  .see-how svg,
  .pill svg {
    flex-shrink: 0;
  }

  /* Intro state, set by the head script only when the animation will play.
     The tagline rises in when the logo finishes, then the button. */
  .intro .hero-logo-static {
    visibility: hidden;
  }

  .intro .hero-tagline,
  .intro .see-how {
    opacity: 0;
    transform: translateY(14px);
  }

  .intro .hero-tagline {
    transition: opacity .8s ease, transform .9s var(--ease);
  }

  .intro .see-how {
    visibility: hidden;
    transition: opacity .8s ease, transform .9s var(--ease), background-color .2s ease;
  }

  .intro .hero.is-revealed .hero-tagline,
  .intro .hero.is-cta .see-how {
    opacity: 1;
    transform: none;
    visibility: visible;
  }

  /* SCREENSHOTS: spotlight strip on blush */
  .how {
    --card-w: min(300px, max(240px, 74vw));
    --gap: 14px;
    --radius: 20px;
    background: #F1DED5;
    padding: clamp(64px, 9vw, 120px) 0 clamp(48px, 7vw, 96px);
  }

  .how:focus {
    outline: none;
  }

  .how-head {
    max-width: calc(1200px + 40px);
    margin: 0 auto;
    padding: 0 20px;
  }

  .how-title {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: clamp(30px, 4.3vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.015em;
    color: #2b2520;
    text-wrap: balance;
  }

  .how-title span {
    display: block;
  }

  .how-title em {
    font-style: italic;
    color: #c2603f;
  }

  .spot-stage {
    position: relative;
    margin-top: clamp(32px, 4.5vw, 52px);
  }

  .spot-strip {
    position: relative;
    display: flex;
    gap: var(--gap);
    padding: 16px 0 32px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  .spot-strip::-webkit-scrollbar {
    display: none;
  }

  /* Spacers on both ends so the first and last cards can sit centered. */
  .spot-strip::before,
  .spot-strip::after {
    content: "";
    flex: 0 0 calc(50% - var(--card-w) / 2 - var(--gap));
  }

  .spot-strip:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: -4px;
  }

  .spot-slot {
    flex: 0 0 var(--card-w);
    scroll-snap-align: center;
  }

  .spot-card {
    aspect-ratio: 750 / 1630;
    border-radius: var(--radius);
    overflow: hidden;
    background: #fdf8f2;
    box-shadow: 0 1px 0 rgba(109,46,25,.05), 0 22px 44px -22px rgba(109,46,25,.42);
  }

  .spot-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }

  /* Spotlight: the card nearest the center is full size, the rest at 88%. */
  .how.is-ready .spot-card {
    transform: scale(.88);
    transition: transform .8s var(--ease);
  }

  .how.is-ready .spot-slot.is-active .spot-card {
    transform: none;
  }

  .how.is-ready .spot-slot:not(.is-active) {
    cursor: pointer;
  }

  /* One-time entrance, started by home.js. */
  .spot-strip.is-pre-enter .spot-slot {
    opacity: 0;
    transform: translateX(140px);
  }

  .spot-strip.is-entering .spot-slot {
    transition: transform .8s var(--ease), opacity .6s ease;
  }

  .spot-dots {
    display: none;
    justify-content: center;
  }

  .how.is-ready .spot-dots {
    display: flex;
  }

  .spot-dot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 44px;
    border: 0;
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }

  .spot-dot span {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(109,46,25,.25);
    transition: width .3s ease, background-color .3s ease;
  }

  .spot-dot[aria-current="true"] span {
    width: 24px;
    background: #c2603f;
  }

  .spot-dot:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: -4px;
  }

  @media (min-width: 768px) {
    .how {
      --card-w: min(360px, max(240px, 74vw));
      --gap: 24px;
      --radius: 24px;
    }

    .how-head {
      max-width: calc(1200px + 64px);
      padding: 0 32px;
    }
  }

  /* CLOSING */
  .closing {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(72px, 10vw, 128px) 24px clamp(56px, 7vw, 88px);
    text-align: center;
  }

  /* App Store badge: Apple artwork shown as supplied, with clear space of
     one quarter of its height on every side. */
  .store-badge {
    padding: 13px;
  }

  .store-badge img {
    display: block;
    height: 52px;
    width: auto;
  }

  .coming {
    font-size: 15px;
    color: #5a4f47;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 54px;
    margin-top: 40px;
    padding: 0 30px;
    border-radius: 999px;
    background: #c2603f;
    color: #f7f1e7;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }

  .pill svg {
    transition: transform .2s ease;
  }

  .pill:hover,
  .pill:focus-visible {
    background: #ad5536;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -10px rgba(109,46,25,.5);
  }

  .pill:hover svg,
  .pill:focus-visible svg {
    transform: translateX(4px);
  }

  .pill:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  @media (min-width: 768px) {
    .store-badge {
      padding: 15px;
    }

    .store-badge img {
      height: 60px;
    }
  }

  /* Reduced motion: everything is shown at rest, sizes change instantly,
     and hover changes color only. */
  @media (prefers-reduced-motion: reduce) {
    .how.is-ready .spot-card,
    .spot-dot span {
      transition: none;
    }

    .pill,
    .pill svg {
      transition: background-color .2s ease;
    }

    .pill:hover,
    .pill:focus-visible {
      transform: none;
      box-shadow: none;
    }

    .pill:hover svg,
    .pill:focus-visible svg {
      transform: none;
    }
  }
</style>
</head>
