<html lang="en">
<head>

<meta property="og:description" content="Menular explains foreign-language menus the way a local would. Scan a menu, see every dish explained, and show staff your order in their language.">

<script>
  /* Decide before first paint whether the logo intro plays, so the hero never
     flashes. Without JavaScript, or with reduced motion, the page keeps the
     static logo and visible tagline. So does arriving at #how-it-works, since
     the opening is off screen and should already be in its final state. */
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !window.fetch || !window.Promise || location.hash === '#how-it-works') {
      return;
    }
    root.classList.add('intro');

    /* Start both downloads now, in parallel, instead of after the page parses. */
    var intro = window.menularIntro = { started: false };
    intro.data = fetch('/assets/animation/menular-logo-intro.json').then(function (r) {
      if (!r.ok) {
        throw new Error('Animation HTTP ' + r.status);
      }
      return r.json();
    });
    intro.lib = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = '/assets/js/lottie_light.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    intro.data.catch(function () {});
    intro.lib.catch(function () {});

    /* If the animation is not playing within 4 seconds, show the static logo. */
    setTimeout(function () {
      if (!intro.started) {
        root.classList.remove('intro');
      }
    }, 4000);
  })();
</script>
<script src="/assets/js/home.js" defer></script>
<link rel="preload" href="/assets/fonts/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/footer.css">
<style>
  :root {
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: #f7f1e7;
    color: #2b2520;
    -webkit-font-smoothing: antialiased;
  }

  /* OPENING: cream, like the app's onboarding welcome screen. Leaves room
     for a strip of the blush section to peek in at the bottom. */
  .hero {
    min-height: max(520px, calc(100vh - 72px));
    min-height: max(520px, calc(100svh - 72px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px;
    text-align: center;
  }

  /* Space for the logo is reserved at the animation's own aspect ratio
     (1913 x 623), so nothing moves when it loads or falls back. */
  .hero-logo {
    position: relative;
    width: clamp(220px, 46vw, 480px);
    max-width: 100%;
    aspect-ratio: 1913 / 623;
  }

  .hero-logo-static {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: auto;
    transform: translateY(-50%);
    border-radius: 8px;
  }

  .hero-logo-anim {
    position: absolute;
    inset: 0;
  }

  .hero-tagline {
    /* font-family: Newsreader, Georgia, serif; */
    font-weight: 400;
    font-size: clamp(22px, 3vw, 36px);
    line-height: 1.25;
    color: #2b2520;
    text-wrap: balance;
  }

  .see-how {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 48px;
    margin-top: clamp(28px, 4vw, 44px);
    padding: 0 22px;
    border: 1.5px solid rgba(194,96,63,.5);
    border-radius: 999px;
    background: transparent;
    color: #6D2E19;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .2s ease;
  }

  .see-how:hover {
    background: #F1DED5;
  }

  .see-how:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  .see-how svg,
  .pill svg {
    flex-shrink: 0;
  }

  /* App Store badge under the button. The gap above it is more than
     Apple's clear space of one quarter of the badge's height. */
  .hero-badge {
    display: block;
    margin-top: clamp(24px, 3vw, 32px);
    border-radius: 8px;
  }

  .hero-badge img {
    display: block;
    height: 52px;
    width: auto;
  }

  @media (min-width: 768px) {
    .hero-badge img {
      height: 56px;
    }
  }

  .hero-badge:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  /* Intro state, set by the head script only when the animation will play.
     The tagline rises in when the logo finishes, then the button and badge. */
  .intro .hero-logo-static {
    visibility: hidden;
  }

  .intro .hero-tagline,
  .intro .see-how,
  .intro .hero-badge {
    opacity: 0;
    transform: translateY(14px);
  }

  .intro .hero-tagline {
    transition: opacity .8s ease, transform .9s var(--ease);
  }

  .intro .see-how {
    visibility: hidden;
    transition: opacity .8s ease, transform .9s var(--ease), background-color .2s ease;
  }

  .intro .hero-badge {
    visibility: hidden;
    transition: opacity .8s ease, transform .9s var(--ease);
  }

  .intro .hero.is-revealed .hero-tagline,
  .intro .hero.is-cta .see-how,
  .intro .hero.is-cta .hero-badge {
    opacity: 1;
    transform: none;
    visibility: visible;
  }

  /* SCREENSHOTS: spotlight strip on blush. The section fills the screen and
     the cards are sized from the available height, so the heading, one whole
     card, and the dots fit at once. home.js measures the stacked heading into
     --how-head-h; without it, three lines are assumed. */
  .how {
    --avail-h: 100vh;
    --w2-w: min(300px, max(240px, 74vw));
    /* Section padding 40 + 20, heading gap 18, strip padding 12 + 24, dots 44. */
    --chrome: 158px;
    --head-h: var(--how-head-h, calc(3 * 1.15 * clamp(24px, 6vw, 34px)));
    --card-h: max(280px, min(calc(var(--w2-w) * 1630 / 750), calc(var(--avail-h) - var(--chrome) - var(--head-h))));
    --card-w: calc(var(--card-h) * 750 / 1630);
    --gap: 14px;
    --radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 40px 0 20px;
    background: #F1DED5;
  }

  @supports (height: 100svh) {
    .how {
      --avail-h: 100svh;
    }
  }

  .how:focus {
    outline: none;
  }

  .how-head {
    max-width: calc(1200px + 40px);
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
  }

  .how-title {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: clamp(24px, 6vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: #2b2520;
    text-wrap: balance;
  }

  .how-title span {
    display: block;
  }

  .how-title em {
    font-style: italic;
    color: #c2603f;
  }

  .spot-stage {
    position: relative;
    margin-top: 18px;
  }

  .spot-strip {
    position: relative;
    display: flex;
    gap: var(--gap);
    padding: 12px 0 24px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  .spot-strip::-webkit-scrollbar {
    display: none;
  }

  /* Spacers on both ends so the first and last cards can sit centered. */
  .spot-strip::before,
  .spot-strip::after {
    content: "";
    flex: 0 0 calc(50% - var(--card-w) / 2 - var(--gap));
  }

  .spot-strip:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: -4px;
  }

  .spot-slot {
    flex: 0 0 var(--card-w);
    scroll-snap-align: center;
  }

  .spot-card {
    aspect-ratio: 750 / 1630;
    border-radius: var(--radius);
    overflow: hidden;
    background: #fdf8f2;
    box-shadow: 0 1px 0 rgba(109,46,25,.05), 0 22px 44px -22px rgba(109,46,25,.42);
  }

  .spot-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }

  /* Spotlight: the card nearest the center is full size, the rest at 88%. */
  .how.is-ready .spot-card {
    transform: scale(.88);
    transition: transform .8s var(--ease);
  }

  .how.is-ready .spot-slot.is-active .spot-card {
    transform: none;
  }

  /* Every card opens the full-screen viewer. */
  .spot-card[role="button"] {
    cursor: zoom-in;
  }

  .spot-card[role="button"]:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  /* Re-centering after the viewer closes happens without animation. */
  .spot-strip.is-instant .spot-card {
    transition: none !important;
  }

  /* One-time entrance, started by home.js. */
  .spot-strip.is-pre-enter .spot-slot {
    opacity: 0;
    transform: translateX(140px);
  }

  .spot-strip.is-entering .spot-slot {
    transition: transform .8s var(--ease), opacity .6s ease;
  }

  .spot-dots {
    display: none;
    justify-content: center;
  }

  .how.is-ready .spot-dots {
    display: flex;
  }

  .spot-dot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 44px;
    border: 0;
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }

  .spot-dot span {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(109,46,25,.25);
    transition: width .3s ease, background-color .3s ease;
  }

  .spot-dot[aria-current="true"] span {
    width: 24px;
    background: #c2603f;
  }

  .spot-dot:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: -4px;
  }

  @media (min-width: 768px) {
    .how {
      --w2-w: min(360px, max(240px, 74vw));
      --gap: 24px;
      --radius: 24px;
    }

    .how-head {
      max-width: calc(1200px + 64px);
      padding: 0 32px;
    }
  }

  /* Desktop: the heading holds still in a left column, vertically centered
     on the active card, and the strip fills the rest. home.js narrows the
     column to the heading's widest line (--how-head-w), so no empty space
     sits between the heading and the strip. The active card is the
     leftmost one, right after a fixed lead-in gap at the start of the strip;
     the rest run off to the right. */
  @media (min-width: 1024px) {
    .how {
      /* Section padding 32 + 32, strip padding 16 + 28, dots 44. */
      --chrome: 152px;
      --head-h: 0px;
      --lead: clamp(40px, 4vw, 64px);
      display: grid;
      grid-template-columns: var(--how-head-w, clamp(320px, 30vw, 440px)) minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-content: center;
      padding: 32px 0 32px max(40px, calc((100vw - 1440px) / 2 + 40px));
    }

    .how-head {
      grid-column: 1;
      grid-row: 1;
      align-self: center;
      max-width: none;
      margin: 0;
      /* The card's center sits 6px above the strip's, because of the strip's
         uneven padding; this keeps the heading level with it. */
      padding: 0 0 12px;
    }

    .how-title {
      font-size: clamp(32px, 3.2vw, 48px);
      line-height: 1.12;
    }

    .spot-stage {
      grid-column: 2;
      grid-row: 1;
      margin-top: 0;
    }

    .spot-strip {
      padding: 16px 0 28px;
      scroll-padding-left: var(--lead);
      /* Soft left edge across the lead-in gap only. At the start the gap is
         empty, so the first card shows in full; once scrolled, earlier cards
         fade out as they pass under it. */
      -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--lead));
      mask-image: linear-gradient(to right, transparent, #000 var(--lead));
    }

    /* The lead-in gap before the first card, and enough room after the last
       one for it to reach the active position. */
    .spot-strip::before {
      flex-basis: calc(var(--lead) - var(--gap));
    }

    .spot-strip::after {
      flex-basis: calc(100% - var(--lead) - var(--card-w) - var(--gap));
    }

    .spot-slot {
      scroll-snap-align: start;
    }

    .spot-dots {
      grid-column: 2;
      grid-row: 2;
    }
  }

  /* FULL-SCREEN VIEWER, built by home.js when the page loads. */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(20,16,13,.96);
    opacity: 0;
    transition: opacity .2s ease;
  }

  .viewer[hidden] {
    display: none;
  }

  .viewer.is-open {
    opacity: 1;
  }

  .viewer-track {
    position: absolute;
    inset: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    touch-action: pan-x pinch-zoom;
  }

  .viewer-track::-webkit-scrollbar {
    display: none;
  }

  .viewer-slide {
    flex: 0 0 100%;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    scroll-snap-align: center;
    scroll-snap-stop: always;
  }

  .viewer-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .viewer-close,
  .viewer-arrow {
    position: absolute;
    z-index: 1;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #f7f1e7;
    cursor: pointer;
  }

  .viewer-close {
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    display: flex;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(247,241,231,.16);
    background: rgba(20,16,13,.6);
  }

  .viewer-count {
    position: absolute;
    top: calc(max(12px, env(safe-area-inset-top)) + 6px);
    right: max(12px, env(safe-area-inset-right));
    z-index: 1;
    display: flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(20,16,13,.6);
    color: rgba(247,241,231,.8);
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .viewer-arrow {
    top: 50%;
    display: none;
    width: 48px;
    height: 48px;
    margin-top: -24px;
    border: 1px solid rgba(247,241,231,.22);
    background: rgba(247,241,231,.1);
    transition: background-color .2s ease, opacity .2s ease;
  }

  .viewer-prev { left: max(16px, env(safe-area-inset-left)); }
  .viewer-next { right: max(16px, env(safe-area-inset-right)); }

  .viewer-arrow:hover:not(:disabled) {
    background: rgba(247,241,231,.2);
  }

  .viewer-arrow:disabled {
    opacity: .3;
    cursor: default;
  }

  .viewer-close:focus-visible,
  .viewer-arrow:focus-visible {
    outline: 2px solid #f7f1e7;
    outline-offset: 3px;
  }

  /* On phones the screenshot spans the full width, so keep the close button
     and counter in their own band above it instead of over its caption. */
  @media (max-width: 767px) {
    .viewer-slide {
      padding-top: calc(max(12px, env(safe-area-inset-top)) + 52px);
    }
  }

  @media (min-width: 768px) {
    .viewer-arrow {
      display: flex;
    }
  }

  /* While the viewer is open the page underneath cannot scroll, iOS included.
     home.js sets the body's top offset and restores the position on close. */
  .viewer-lock body {
    position: fixed;
    left: 0;
    right: 0;
    overflow: hidden;
  }

  /* CLOSING */
  .closing {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(72px, 10vw, 128px) 24px clamp(56px, 7vw, 88px);
    text-align: center;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 54px;
    padding: 0 30px;
    border-radius: 999px;
    background: #c2603f;
    color: #f7f1e7;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }

  .pill svg {
    transition: transform .2s ease;
  }

  .pill:hover,
  .pill:focus-visible {
    background: #ad5536;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -10px rgba(109,46,25,.5);
  }

  .pill:hover svg,
  .pill:focus-visible svg {
    transform: translateX(4px);
  }

  .pill:focus-visible {
    outline: 2px solid #6D2E19;
    outline-offset: 3px;
  }

  /* Reduced motion: everything is shown at rest, sizes change instantly,
     and hover changes color only. */
  @media (prefers-reduced-motion: reduce) {
    .how.is-ready .spot-card,
    .spot-dot span,
    .viewer,
    .viewer-arrow {
      transition: none;
    }

    .pill,
    .pill svg {
      transition: background-color .2s ease;
    }

    .pill:hover,
    .pill:focus-visible {
      transform: none;
      box-shadow: none;
    }

    .pill:hover svg,
    .pill:focus-visible svg {
      transform: none;
    }
  }
</style>
</head>
<body>

<!-- OPENING -->
<header class="hero">
  <div class="hero-logo" role="img" aria-label="Menular">
    <img class="hero-logo-static" src="/assets/logo.svg" width="2249" height="560" alt="">
    <div class="hero-logo-anim"></div>
  </div>
  <h1 class="hero-tagline">Discover what’s really on the menu</h1>
  <a class="see-how" href="#how-it-works">
    See How It Works
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M19 12l-7 7-7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="hero-badge" href="https://apps.apple.com/app/id6793560717" aria-label="Download Menular on the App Store"><img src="/assets/badges/app-store-badge.svg" width="180" height="60" alt="Download on the App Store"></a>
</header>

<main>

<!-- SCREENSHOTS -->
<section class="how" id="how-it-works" aria-label="How Menular works" tabindex="-1">
  <div class="how-head">
    <h2 class="how-title">
      <span>Most apps stop at translation.</span>
      <span>Menular takes you <em>all the way to a placed order</em></span>
    </h2>
  </div>

  <div class="spot-stage">
    <div class="spot-strip" role="region" tabindex="0" aria-label="App screenshots, scroll sideways">
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/01-home.jpg" width="750" height="1630" alt="Discover what's really on the menu. Scan a new menu, or pick up right where you left off."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/02-menu-builder.jpg" width="750" height="1630" alt="Dishes explained in detail, with local context. Photos, descriptions, taste tags, and prices in your own currency."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/03-dish-detail.jpg" width="750" height="1630" loading="lazy" alt="Know exactly what you're ordering. See dish or beverage details, and understand what makes it worth trying."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/04-translated-order.jpg" width="750" height="1630" loading="lazy" alt="Order without saying a word. Staff read your order on screen. No live translation needed."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/05-ask-staff-questions.jpg" width="750" height="1630" loading="lazy" alt="Ask before you order. Staff tap their answers, right on your screen."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/06-filter.jpg" width="750" height="1630" loading="lazy" alt="Find the dishes that suit you. Narrow any menu by dietary need, spice level, or taste profile."></div></div>
      <div class="spot-slot"><div class="spot-card"><img src="/assets/app-screens/07-learn.jpg" width="750" height="1630" loading="lazy" alt="Learn the menu language. Everything you order becomes part of your own study guide, no textbook required."></div></div>
    </div>
  </div>

  <div class="spot-dots">
    <button type="button" class="spot-dot" aria-label="Show Scan"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Discover"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Know"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Order"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Ask"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Filter"><span></span></button>
    <button type="button" class="spot-dot" aria-label="Show Learn"><span></span></button>
  </div>
